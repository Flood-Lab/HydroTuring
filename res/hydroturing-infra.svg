<svg class="infra" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="infratitle" xmlns="http://www.w3.org/2000/svg">
<title id="infratitle">Flowchart: any AI hydrologic model enters through the /io contract, HydroTuring probes it against mass, energy and momentum, and a verdict with its reason comes out</title>
<style>
  .infra text{font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; fill:#33474F}
  .infra .eyebrow{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.14em; fill:#0E6C78}
  .infra .title{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:13.5px; font-weight:600; fill:#0F1B21}
  .infra .brand{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:17px; font-weight:700; letter-spacing:-.01em; fill:#0F1B21}
  .infra .pillar{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.13em; fill:#0E6C78}
  .infra .step{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:11px; font-weight:600; fill:#0F1B21}
  .infra .probe{font-size:10.5px; fill:#33474F}
  .infra .note{font-size:10.5px; fill:#5B6E76}
  .infra .note-small{font-size:9.5px; fill:#5B6E76}
  .infra .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10px; fill:#0F1B21}
  .infra .mono-small{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:9px; fill:#5B6E76}
  .infra .mono-accent{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10.5px; fill:#0E6C78}
  .infra .mono-small-accent{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:9px; fill:#0E6C78}
  .infra .tag-pass{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:11px; font-weight:600; fill:#2C7A57}
  .infra .tag-fail{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:11px; font-weight:600; fill:#A8501C}
  .infra .tag-na{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:11px; font-weight:600; fill:#5B6E76}
</style>
<defs><marker id="infra-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E6C78"/></marker></defs>
<rect x="16" y="140" width="144" height="212" rx="8" fill="#FFFFFF" stroke="#B6C6C9"/>
<text x="88" y="164" class="eyebrow" text-anchor="middle">ANY MODEL</text>
<text x="88" y="188" class="title" text-anchor="middle">AI, hybrid or</text>
<text x="88" y="205" class="title" text-anchor="middle">process-based</text>
<text x="88" y="223" class="note" text-anchor="middle">any language</text>
<rect x="34" y="240" width="108" height="18" rx="4" fill="#EDF2F2"/>
<text x="88" y="252.5" class="mono" text-anchor="middle">model.yaml</text>
<rect x="34" y="264" width="108" height="18" rx="4" fill="#EDF2F2"/>
<text x="88" y="276.5" class="mono" text-anchor="middle">Dockerfile</text>
<rect x="34" y="288" width="108" height="18" rx="4" fill="#EDF2F2"/>
<text x="88" y="300.5" class="mono" text-anchor="middle">ht_adapter.py</text>
<text x="88" y="329" class="note" text-anchor="middle">a container and a</text>
<text x="88" y="342" class="note" text-anchor="middle">thirty-line adapter</text>
<line x1="162" y1="246" x2="258" y2="246" stroke="#0E6C78" stroke-width="1.5" marker-end="url(#infra-arrow)"/>
<text x="211" y="196" class="mono-accent" text-anchor="middle">/io</text>
<text x="211" y="210" class="mono-small" text-anchor="middle">request.json</text>
<text x="211" y="222" class="mono-small" text-anchor="middle">forcing.csv</text>
<text x="211" y="234" class="mono-small" text-anchor="middle">static.json</text>
<text x="211" y="264" class="note" text-anchor="middle">no network</text>
<text x="211" y="277" class="note" text-anchor="middle">read-only inputs</text>
<rect x="262" y="40" width="310" height="400" rx="10" fill="#FFFFFF" stroke="#0E6C78" stroke-width="1.5"/>
<path d="M281 56 l6 -8 l6 8 a6 6 0 1 1 -12 0 z" fill="#0E6C78"/>
<text x="296" y="67" class="brand">HydroTuring</text>
<text x="417" y="86" class="note" text-anchor="middle">does it conserve what physics says it must?</text>
<rect x="272" y="100" width="92" height="196" rx="6" fill="#EDF2F2"/>
<text x="318" y="121" class="pillar" text-anchor="middle">MASS</text>
<text x="318" y="138" class="note" text-anchor="middle">water budget</text>
<text x="318" y="151" class="note" text-anchor="middle">closes</text>
<line x1="284" y1="160" x2="352" y2="160" stroke="#D6E0E2"/>
<circle cx="288" cy="169.5" r="2.4" fill="#2C7A57"/>
<text x="296" y="173" class="probe">closure</text>
<circle cx="288" cy="185.5" r="2.4" fill="#2C7A57"/>
<text x="296" y="189" class="probe">resolution</text>
<circle cx="288" cy="201.5" r="2.4" fill="#2C7A57"/>
<text x="296" y="205" class="probe">warming</text>
<circle cx="288" cy="217.5" r="2.4" fill="#2C7A57"/>
<text x="296" y="221" class="probe">causality</text>
<circle cx="288" cy="233.5" r="2.4" fill="#2C7A57"/>
<text x="296" y="237" class="probe">dry-down</text>
<circle cx="288" cy="249.5" r="2.4" fill="#2C7A57"/>
<text x="296" y="253" class="probe">steady state</text>
<circle cx="288" cy="265.5" r="2.4" fill="#2C7A57"/>
<text x="296" y="269" class="probe">extreme rain</text>
<rect x="372" y="100" width="92" height="196" rx="6" fill="#EDF2F2"/>
<text x="418" y="121" class="pillar" text-anchor="middle">ENERGY</text>
<text x="418" y="138" class="note" text-anchor="middle">energy budget</text>
<text x="418" y="151" class="note" text-anchor="middle">closes</text>
<line x1="384" y1="160" x2="452" y2="160" stroke="#D6E0E2"/>
<rect x="384" y="170" width="68" height="40" rx="5" fill="none" stroke="#B6C6C9" stroke-dasharray="3 3"/>
<text x="418" y="194" class="note" text-anchor="middle">probes wanted</text>
<rect x="472" y="100" width="92" height="196" rx="6" fill="#EDF2F2"/>
<text x="518" y="121" class="pillar" text-anchor="middle">MOMENTUM</text>
<text x="518" y="138" class="note" text-anchor="middle">routing conserves</text>
<text x="518" y="151" class="note" text-anchor="middle">momentum</text>
<line x1="484" y1="160" x2="552" y2="160" stroke="#D6E0E2"/>
<rect x="484" y="170" width="68" height="40" rx="5" fill="none" stroke="#B6C6C9" stroke-dasharray="3 3"/>
<text x="518" y="194" class="note" text-anchor="middle">probes wanted</text>
<text x="417" y="322" class="mono-small" text-anchor="middle">seed → case → run → one bit</text>
<rect x="272" y="332" width="68" height="72" rx="6" fill="#FFFFFF" stroke="#D6E0E2"/>
<text x="306" y="355" class="step" text-anchor="middle">seeded</text>
<text x="306" y="369" class="step" text-anchor="middle">generator</text>
<text x="306" y="391" class="note-small" text-anchor="middle">nothing stored</text>
<path d="M343 364 l4 4 l-4 4" fill="none" stroke="#0E6C78" stroke-width="1.5"/>
<rect x="348" y="332" width="68" height="72" rx="6" fill="#FFFFFF" stroke="#D6E0E2"/>
<text x="382" y="355" class="step" text-anchor="middle">sealed</text>
<text x="382" y="369" class="step" text-anchor="middle">container</text>
<text x="382" y="391" class="note-small" text-anchor="middle">no network</text>
<path d="M419 364 l4 4 l-4 4" fill="none" stroke="#0E6C78" stroke-width="1.5"/>
<rect x="424" y="332" width="68" height="72" rx="6" fill="#FFFFFF" stroke="#D6E0E2"/>
<text x="458" y="355" class="step" text-anchor="middle">binary</text>
<text x="458" y="369" class="step" text-anchor="middle">criteria</text>
<text x="458" y="391" class="note-small" text-anchor="middle">the 5% rule</text>
<path d="M495 364 l4 4 l-4 4" fill="none" stroke="#0E6C78" stroke-width="1.5"/>
<rect x="500" y="332" width="68" height="72" rx="6" fill="#FFFFFF" stroke="#D6E0E2"/>
<text x="534" y="355" class="step" text-anchor="middle">acceptance</text>
<text x="534" y="369" class="step" text-anchor="middle">gate</text>
<text x="534" y="388" class="note-small" text-anchor="middle">must pass</text>
<text x="534" y="399" class="note-small" text-anchor="middle">must fail</text>
<line x1="574" y1="246" x2="646" y2="246" stroke="#0E6C78" stroke-width="1.5" marker-end="url(#infra-arrow)"/>
<text x="610" y="226" class="mono-small" text-anchor="middle">result.csv</text>
<text x="610" y="238" class="mono-small" text-anchor="middle">run.json</text>
<rect x="650" y="140" width="134" height="212" rx="8" fill="#FFFFFF" stroke="#B6C6C9"/>
<text x="717" y="124" class="mono-accent" text-anchor="middle">$ ht run --model</text>
<text x="717" y="164" class="eyebrow" text-anchor="middle">VERDICT</text>
<rect x="662" y="176" width="36" height="20" rx="4" fill="#DFF0E7"/>
<text x="680" y="190" class="tag-pass" text-anchor="middle">PASS</text>
<rect x="703" y="176" width="36" height="20" rx="4" fill="#F6E5D9"/>
<text x="721" y="190" class="tag-fail" text-anchor="middle">FAIL</text>
<rect x="744" y="176" width="36" height="20" rx="4" fill="#EDF2F2"/>
<text x="762" y="190" class="tag-na" text-anchor="middle">N/A</text>
<text x="717" y="214" class="note" text-anchor="middle">with its reason</text>
<text x="717" y="229" class="mono-small" text-anchor="middle">OK</text>
<text x="717" y="241" class="mono-small" text-anchor="middle">VIOLATION</text>
<text x="717" y="253" class="mono-small" text-anchor="middle">INCOMPLETE</text>
<text x="717" y="265" class="mono-small" text-anchor="middle">INCOMPATIBLE</text>
<text x="717" y="277" class="mono-small" text-anchor="middle">ERROR</text>
<line x1="664" y1="296" x2="770" y2="296" stroke="#D6E0E2"/>
<text x="717" y="312" class="note" text-anchor="middle">every criterion</text>
<text x="717" y="325" class="note" text-anchor="middle">keeps its number</text>
<text x="717" y="339" class="note-small" text-anchor="middle">archived to</text>
<text x="717" y="349.5" class="mono-small-accent" text-anchor="middle">models/result.csv</text>
</svg>
