<svg class="infra" width="800" height="510" viewBox="0 0 800 510" role="img" aria-labelledby="infratitle" xmlns="http://www.w3.org/2000/svg">
<title id="infratitle">Flowchart: any AI hydrologic model enters through the /io contract, HydroTuring probes it against mass, energy and momentum, and a verdict with its reason comes out</title>
<style>
.infra text{font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; fill:#BACBD1}
.infra .eyebrow{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.14em; fill:#54C6D1}
.infra .title{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:13.5px; font-weight:600; fill:#E3ECEE}
.infra .brand{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:17px; font-weight:700; letter-spacing:-.01em; fill:#E3ECEE}
.infra .pillar{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.13em; fill:#54C6D1}
.infra .step{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif; font-size:11px; font-weight:600; fill:#E3ECEE}
.infra .probe{font-size:10.5px; fill:#BACBD1}
.infra .note{font-size:10.5px; fill:#8CA2AA}
.infra .note-small{font-size:9.5px; fill:#8CA2AA}
.infra .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10px; fill:#E3ECEE}
.infra .mono-small{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:9px; fill:#8CA2AA}
.infra .mono-accent{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10.5px; fill:#54C6D1}
.infra .mono-small-accent{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:9px; fill:#54C6D1}
.infra .tag-pass{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:11px; font-weight:600; fill:#63C193}
.infra .tag-fail{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:11px; font-weight:600; fill:#E28B57}
.infra .tag-na{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:11px; font-weight:600; fill:#8CA2AA}
</style>
<defs><marker id="infra-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#54C6D1"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="509" rx="10" fill="#111D22" stroke="#20313A"/>
<rect x="16" y="160" width="144" height="212" rx="8" fill="#111D22" stroke="#2E444E"/>
<text x="88" y="184" class="eyebrow" text-anchor="middle">ANY MODEL</text>
<text x="88" y="208" class="title" text-anchor="middle">AI, hybrid or</text>
<text x="88" y="225" class="title" text-anchor="middle">process-based</text>
<text x="88" y="243" class="note" text-anchor="middle">any language</text>
<rect x="34" y="260" width="108" height="18" rx="4" fill="#16242A"/>
<text x="88" y="272.5" class="mono" text-anchor="middle">model.yaml</text>
<rect x="34" y="284" width="108" height="18" rx="4" fill="#16242A"/>
<text x="88" y="296.5" class="mono" text-anchor="middle">Dockerfile</text>
<rect x="34" y="308" width="108" height="18" rx="4" fill="#16242A"/>
<text x="88" y="320.5" class="mono" text-anchor="middle">ht_adapter.py</text>
<text x="88" y="349" class="note" text-anchor="middle">a container and a</text>
<text x="88" y="362" class="note" text-anchor="middle">thirty-line adapter</text>
<line x1="162" y1="266" x2="258" y2="266" stroke="#54C6D1" stroke-width="1.5" marker-end="url(#infra-arrow)"/>
<text x="211" y="216" class="mono-accent" text-anchor="middle">/io</text>
<text x="211" y="230" class="mono-small" text-anchor="middle">request.json</text>
<text x="211" y="242" class="mono-small" text-anchor="middle">forcing.csv</text>
<text x="211" y="254" class="mono-small" text-anchor="middle">static.json</text>
<text x="211" y="284" class="note" text-anchor="middle">no network</text>
<text x="211" y="297" class="note" text-anchor="middle">read-only inputs</text>
<rect x="262" y="40" width="310" height="452.5" rx="10" fill="#111D22" stroke="#54C6D1" stroke-width="1.5"/>
<path d="M281 56 l6 -8 l6 8 a6 6 0 1 1 -12 0 z" fill="#54C6D1"/>
<text x="296" y="67" class="brand">HydroTuring</text>
<text x="417" y="86" class="note" text-anchor="middle">does it conserve what physics says it must?</text>
<rect x="272" y="100" width="92" height="280.5" rx="6" fill="#16242A"/>
<text x="318" y="121" class="pillar" text-anchor="middle">MASS</text>
<text x="318" y="138" class="note" text-anchor="middle">water budget</text>
<text x="318" y="151" class="note" text-anchor="middle">closes</text>
<line x1="284" y1="160" x2="352" y2="160" stroke="#20313A"/>
<circle cx="288" cy="169.50" r="2.4" fill="#63C193"/>
<text x="296" y="173.00" class="probe">closure</text>
<circle cx="288" cy="177.73" r="2.4" fill="#63C193"/>
<text x="296" y="181.23" class="probe">ungauged</text>
<circle cx="288" cy="185.95" r="2.4" fill="#63C193"/>
<text x="296" y="189.45" class="probe">event budget</text>
<circle cx="288" cy="194.18" r="2.4" fill="#63C193"/>
<text x="296" y="197.68" class="probe">resolution</text>
<circle cx="288" cy="202.40" r="2.4" fill="#63C193"/>
<text x="296" y="205.90" class="probe">warming</text>
<circle cx="288" cy="210.63" r="2.4" fill="#63C193"/>
<text x="296" y="214.13" class="probe">causality</text>
<circle cx="288" cy="218.86" r="2.4" fill="#63C193"/>
<text x="296" y="222.36" class="probe">dry-down</text>
<circle cx="288" cy="227.08" r="2.4" fill="#63C193"/>
<text x="296" y="230.58" class="probe">steady state</text>
<circle cx="288" cy="235.31" r="2.4" fill="#63C193"/>
<text x="296" y="238.81" class="probe">spin-up cycle</text>
<circle cx="288" cy="243.53" r="2.4" fill="#63C193"/>
<text x="296" y="247.03" class="probe">drift</text>
<circle cx="288" cy="251.76" r="2.4" fill="#63C193"/>
<text x="296" y="255.26" class="probe">extreme rain</text>
<circle cx="288" cy="259.99" r="2.4" fill="#63C193"/>
<text x="296" y="263.49" class="probe">bounds</text>
<circle cx="288" cy="268.21" r="2.4" fill="#63C193"/>
<text x="296" y="271.71" class="probe">area</text>
<circle cx="288" cy="276.44" r="2.4" fill="#63C193"/>
<text x="296" y="279.94" class="probe">nonnegative</text>
<circle cx="288" cy="284.67" r="2.4" fill="#63C193"/>
<text x="296" y="288.17" class="probe">antecedent</text>
<circle cx="288" cy="292.89" r="2.4" fill="#63C193"/>
<text x="296" y="296.39" class="probe">phase</text>
<circle cx="288" cy="301.12" r="2.4" fill="#63C193"/>
<text x="296" y="304.62" class="probe">time origin</text>
<circle cx="288" cy="309.34" r="2.4" fill="#63C193"/>
<text x="296" y="312.84" class="probe">rain ±20%</text>
<circle cx="288" cy="317.57" r="2.4" fill="#63C193"/>
<text x="296" y="321.07" class="probe">withdrawal</text>
<circle cx="288" cy="325.80" r="2.4" fill="#63C193"/>
<text x="296" y="329.30" class="probe">snowpack</text>
<circle cx="288" cy="334.02" r="2.4" fill="#63C193"/>
<text x="296" y="337.52" class="probe">gw exchange</text>
<circle cx="288" cy="342.25" r="2.4" fill="#63C193"/>
<text x="296" y="345.75" class="probe">exchange</text>
<circle cx="288" cy="350.47" r="2.4" fill="#63C193"/>
<text x="296" y="353.97" class="probe">datum shift</text>
<circle cx="288" cy="358.70" r="2.4" fill="#63C193"/>
<text x="296" y="362.20" class="probe">recharge</text>
<circle cx="288" cy="371.20" r="2.4" fill="#63C193"/>
<text x="296" y="374.70" class="probe">head bounds</text>
<rect x="372" y="100" width="92" height="280.5" rx="6" fill="#16242A"/>
<text x="418" y="121" class="pillar" text-anchor="middle">ENERGY</text>
<text x="418" y="138" class="note" text-anchor="middle">energy budget</text>
<text x="418" y="151" class="note" text-anchor="middle">closes</text>
<line x1="384" y1="160" x2="452" y2="160" stroke="#20313A"/>
<circle cx="388" cy="169.5" r="2.4" fill="#63C193"/>
<text x="396" y="173" class="probe">PET demand</text>
<circle cx="388" cy="183.5" r="2.4" fill="#63C193"/>
<text x="396" y="187" class="probe">latent heat</text>
<circle cx="388" cy="197.5" r="2.4" fill="#63C193"/>
<text x="396" y="201" class="probe">partition</text>
<circle cx="388" cy="211.5" r="2.4" fill="#63C193"/>
<text x="396" y="215" class="probe">day / night</text>
<circle cx="388" cy="225.5" r="2.4" fill="#63C193"/>
<text x="396" y="229" class="probe">radiation</text>
<circle cx="388" cy="239.5" r="2.4" fill="#63C193"/>
<text x="396" y="243" class="probe">soil heat</text>
<circle cx="388" cy="253.5" r="2.4" fill="#63C193"/>
<text x="396" y="257" class="probe">snowmelt</text>
<rect x="384" y="272" width="68" height="40" rx="5" fill="none" stroke="#2E444E" stroke-dasharray="3 3"/>
<text x="418" y="296" class="note" text-anchor="middle">probes wanted</text>
<rect x="472" y="100" width="92" height="280.5" rx="6" fill="#16242A"/>
<text x="518" y="121" class="pillar" text-anchor="middle">MOMENTUM</text>
<text x="518" y="138" class="note" text-anchor="middle">routing conserves</text>
<text x="518" y="151" class="note" text-anchor="middle">momentum</text>
<line x1="484" y1="160" x2="552" y2="160" stroke="#20313A"/>
<circle cx="488" cy="169.5" r="2.4" fill="#63C193"/>
<text x="496" y="173" class="probe">routing</text>
<circle cx="488" cy="183.5" r="2.4" fill="#63C193"/>
<text x="496" y="187" class="probe">travel time</text>
<circle cx="488" cy="197.5" r="2.4" fill="#63C193"/>
<text x="496" y="201" class="probe">stage rating</text>
<circle cx="488" cy="211.5" r="2.4" fill="#63C193"/>
<text x="496" y="215" class="probe">friction</text>
<text x="496" y="229" class="probe">subcritical</text>
<circle cx="488" cy="239.5" r="2.4" fill="#63C193"/>
<text x="496" y="243" class="probe">wave speed</text>
<rect x="484" y="258" width="68" height="40" rx="5" fill="none" stroke="#2E444E" stroke-dasharray="3 3"/>
<text x="518" y="282" class="note" text-anchor="middle">probes wanted</text>
<g transform="translate(0 12.5)">
<text x="417" y="378" class="mono-small" text-anchor="middle">seed → case → run → one bit</text>
<rect x="272" y="384" width="68" height="72" rx="6" fill="#111D22" stroke="#20313A"/>
<text x="306" y="407" class="step" text-anchor="middle">seeded</text>
<text x="306" y="421" class="step" text-anchor="middle">generator</text>
<text x="306" y="443" class="note-small" text-anchor="middle">nothing stored</text>
<path d="M343 416 l4 4 l-4 4" fill="none" stroke="#54C6D1" stroke-width="1.5"/>
<rect x="348" y="384" width="68" height="72" rx="6" fill="#111D22" stroke="#20313A"/>
<text x="382" y="407" class="step" text-anchor="middle">sealed</text>
<text x="382" y="421" class="step" text-anchor="middle">container</text>
<text x="382" y="443" class="note-small" text-anchor="middle">no network</text>
<path d="M419 416 l4 4 l-4 4" fill="none" stroke="#54C6D1" stroke-width="1.5"/>
<rect x="424" y="384" width="68" height="72" rx="6" fill="#111D22" stroke="#20313A"/>
<text x="458" y="407" class="step" text-anchor="middle">binary</text>
<text x="458" y="421" class="step" text-anchor="middle">criteria</text>
<text x="458" y="443" class="note-small" text-anchor="middle">the 5% rule</text>
<path d="M495 416 l4 4 l-4 4" fill="none" stroke="#54C6D1" stroke-width="1.5"/>
<rect x="500" y="384" width="68" height="72" rx="6" fill="#111D22" stroke="#20313A"/>
<text x="534" y="407" class="step" text-anchor="middle">acceptance</text>
<text x="534" y="421" class="step" text-anchor="middle">gate</text>
<text x="534" y="440" class="note-small" text-anchor="middle">must pass</text>
<text x="534" y="451" class="note-small" text-anchor="middle">must fail</text>
</g>
<line x1="574" y1="266" x2="646" y2="266" stroke="#54C6D1" stroke-width="1.5" marker-end="url(#infra-arrow)"/>
<text x="610" y="246" class="mono-small" text-anchor="middle">result.csv</text>
<text x="610" y="258" class="mono-small" text-anchor="middle">run.json</text>
<rect x="650" y="160" width="134" height="212" rx="8" fill="#111D22" stroke="#2E444E"/>
<text x="717" y="144" class="mono-accent" text-anchor="middle">$ ht run --model</text>
<text x="717" y="184" class="eyebrow" text-anchor="middle">VERDICT</text>
<rect x="662" y="196" width="36" height="20" rx="4" fill="#14301F"/>
<text x="680" y="210" class="tag-pass" text-anchor="middle">PASS</text>
<rect x="703" y="196" width="36" height="20" rx="4" fill="#33200F"/>
<text x="721" y="210" class="tag-fail" text-anchor="middle">FAIL</text>
<rect x="744" y="196" width="36" height="20" rx="4" fill="#16242A"/>
<text x="762" y="210" class="tag-na" text-anchor="middle">N/A</text>
<text x="717" y="234" class="note" text-anchor="middle">with its reason</text>
<text x="717" y="249" class="mono-small" text-anchor="middle">OK</text>
<text x="717" y="261" class="mono-small" text-anchor="middle">VIOLATION</text>
<text x="717" y="273" class="mono-small" text-anchor="middle">INCOMPLETE</text>
<text x="717" y="285" class="mono-small" text-anchor="middle">INCOMPATIBLE</text>
<text x="717" y="297" class="mono-small" text-anchor="middle">ERROR</text>
<line x1="664" y1="316" x2="770" y2="316" stroke="#20313A"/>
<text x="717" y="332" class="note" text-anchor="middle">every criterion</text>
<text x="717" y="345" class="note" text-anchor="middle">keeps its number</text>
<text x="717" y="359" class="note-small" text-anchor="middle">archived to</text>
<text x="717" y="369.5" class="mono-small-accent" text-anchor="middle">models/result.csv</text>
</svg>
