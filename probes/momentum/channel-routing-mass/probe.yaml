id: momentum/channel-routing-mass
title: A reach that is not being fed cannot fill
law: momentum
track: synthetic
version: 1

authors:
  - name: Yuanhang Liu
    affiliation: Independent Researcher
    github: kawh1111
    orcid: 0009-0005-9633-6004

description: >
  Three years of temperate weather with four large storms, each followed by
  a long dry spell, for any model that routes its runoff and reports the
  water in transit as the channel store. That store is generated runoff not
  yet released, and this is its mass shadow: when no water is entering the
  reach, the only thing the store can do is drain. An honest router falls,
  step after step, until the next storm arrives. A reach that receives water
  it never generated rises on those steps instead, and because what is read
  is the direction of the change rather than its size, the error does not
  have to be large: `reference_unreported_inflow` stays far inside the store
  bound and still fails here. The budget in `momentum/routing-conservation`
  asks how much the reach holds; this asks which way it moved, and no closure
  test sees either, because the error is confined to the channel.

requires:
  # `non_degenerate` scores `mrro`, which its `cv_variables` name, so the probe
  # has to declare it: with no flux required, a submission that reports a
  # discharge and a channel store but no runoff depth would be scored here, and
  # the anti-degeneracy criterion would pass having checked nothing at all.
  fluxes: [mrro]
  states: [channel]

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 3
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  min_window_days: 1095

criteria:
  # On rainless stretches the store may only fall. The measure is the share of
  # those steps on which it rose, so one startup sample cannot decide it.
  - recession_drainage:
      store: channel
      settle_days: 3
      rise_fraction: 1.0e-4
      max_rising_fraction: 0.25

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  # The exact bucket does not route: its channel store is identically zero at
  # every step, so it never rises and passes trivially, which is the honest
  # reading. The two FLEX models and SAC-SMA route through a lag and are the
  # real test.
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    # A lossy router: a three-day triangular kernel summing to 0.9, so a tenth
    # of every day's runoff never leaves the reach and the store walks away
    # from its own history. `momentum/routing-conservation` catches that too,
    # by its size.
    reference_stuck_router: recession_drainage
    # The baseline that separates the two questions. Routing is exact and the
    # water budget closes; the fault is a bounded inflow to the reach that the
    # model never reports, 0.05 mm over the record, applied on rainless steps.
    # It is small enough that the store never approaches the fifteen-day bound
    # `momentum/routing-conservation` enforces — that probe passes this model —
    # while this probe fails it, because the store rises on step after step
    # where nothing entered. A bound sees an error that accumulates; this
    # criterion sees one of any size, applied where nothing masks it.
    reference_unreported_inflow: recession_drainage

provenance: >
  Synthetic. Generated at run time from a recorded seed, with four storms
  and long dry spells between them. Nothing is committed as data.
