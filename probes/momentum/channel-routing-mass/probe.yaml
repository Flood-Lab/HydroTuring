id: momentum/channel-routing-mass
title: A reach that is not being fed cannot fill
law: momentum
track: synthetic
version: 1

authors:
  - name: Yuanhang Liu
    affiliation: Independent Researcher
    github: kawh1111
    orcid: 0009-0005-9633-6004

description: >
  Three years of temperate weather with four large storms, each followed by
  a long dry spell, for any model that routes its runoff and reports the
  water in transit as the channel store. That store is generated runoff not
  yet released, and this is its mass shadow: when no water is entering the
  reach, the only thing the store can do is drain. An honest router falls,
  step after step, until the next storm arrives; a router that loses or
  invents water inside its routing has to apply that error on every one of
  those steps, and the store rises where it should fall. The budget in
  `momentum/routing-conservation` bounds the store but never asks whether
  it moved for a reason, and no closure test sees it either, because the
  error is confined to the channel.

requires:
  fluxes: []
  states: [channel]

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 3
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  min_window_days: 1095

criteria:
  # On rainless stretches the store may only fall. The measure is the share of
  # those steps on which it rose, so one startup sample cannot decide it.
  - recession_drainage:
      store: channel
      settle_days: 3
      rise_fraction: 1.0e-4
      max_rising_fraction: 0.25

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  # The exact bucket does not route: its channel store is identically zero at
  # every step, so it never rises and passes trivially, which is the honest
  # reading. The two FLEX models and SAC-SMA route through a lag and are the
  # real test.
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    # A triangular kernel summing to 0.9: a tenth of every day's runoff never
    # leaves, and the shortfall accumulates in the channel store across every
    # step of every recession.
    reference_leaky_router: recession_drainage

provenance: >
  Synthetic. Generated at run time from a recorded seed, with four storms
  and long dry spells between them. Nothing is committed as data.
