id: momentum/routing-conservation
title: A routing store holds runoff for as long as its hydrograph and no longer
law: momentum
track: synthetic
version: 2

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss
  - name: Yuanhang Liu
    affiliation: Independent Researcher
    github: kawh1111
    orcid: 0009-0005-9633-6004

description: >
  Three years of temperate weather with four large storms, each followed by
  a long dry spell, for any model that routes its runoff and reports the
  water in transit as the channel store. That store is generated runoff not
  yet released. It can never be negative, and it can never hold more than the
  flow feeding it could have put there over the length of its hydrograph: at
  any step the channel is at most fifteen days of the largest runoff seen
  over the preceding month. A kernel that does not sum to one leaves water in
  the channel forever, and the store grows past what any hydrograph can hold.
  The dry spells are what make the smaller leak visible: over a rainless
  spell the runoff falls to the baseflow and then to nothing, so the peak the
  allowance is read from decays out of its window and the ceiling comes down
  with it. A kernel that retains a tenth of a percent of every day's runoff
  fails on this record, and on a record that never goes dry it stays inside
  the window's peak and passes. The first probe under the momentum law: the
  channel is where momentum is conserved, and this is its mass shadow.

requires:
  fluxes: [mrro]
  states: [channel]

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 3
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  min_window_days: 1095

criteria:
  - routing_conservation:
      max_lag_days: 15
      lookback_days: 30
      tolerance: 0.05
      # The one part of the allowance that is absolute rather than a multiple
      # of the recent peak. It is there for the reach that has stopped being fed
      # and still holds the dead storage its own hydraulics keep: with the
      # proportional term decayed to nothing over a long dry spell, a residue of
      # a few thousandths of a millimetre is channel geometry rather than a leak.
      # `wflow_sbm`'s river is the case it exists for, and its need is the
      # largest measured on this case: 0.0026 mm through the droughts, against
      # which this value leaves it about 19x. On the three gate seeds the models
      # that route sit at 0.01 to 0.58 of the whole allowance (summa 0.01, dhbv2
      # 0.04, flex_topo 0.11, lisflood 0.12, wflow_sbm and sacsma_snow17 0.16,
      # cwatm 0.47, flex_lumped 0.58), whose tightest leaves 1.7x of room, and
      # the smallest leak this probe exists to catch — a kernel keeping a tenth
      # of a percent of every day's runoff — is caught at 4.13x to 4.40x, the
      # smallest of the three seeds being the one that governs.
      min_allowance_mm: 0.05

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  # The exact bucket does not route: its channel store is identically zero
  # and it reports it so, which satisfies the bound trivially. The two FLEX
  # models route through a lag and are the real test.
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    # A three-day kernel summing to 0.9: a tenth of every day's runoff
    # never leaves the channel, and the store grows without bound.
    reference_stuck_router: routing_conservation

provenance: >
  Synthetic. Generated at run time from a recorded seed, with four storms and
  the rainless spell that follows each one. Nothing is committed as data.

# Version 2 changes the weather, so the case is not the one the earlier rows for
# this probe were run on. The boundary is the version, not a date: the rows dated
# up to 2026-09-15 are the old weather, and those dated 2026-09-16 and
# 2026-09-17 — including the four baselines the README's figures come from — are
# this one. The harness appends to `models/result.csv` and a model's standing is
# read from its last row for the probe, so the earlier rows are kept as history
# and the later ones govern.
