id: mass/response-nonnegativity
title: More water can never lower the flow, on any day
law: mass
track: synthetic
version: 1

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  The same weather twice, the second copy with one 120 mm storm added on
  one day. The extreme-rain probe checks that added rain adds runoff in
  total; this checks it day by day. From the storm onward the perturbed
  run's runoff may not fall below the control's on any day, by more than a
  thousandth of the rain that was added. A catchment's stores drain faster
  when fuller, never slower, so more water cannot mean less flow at any
  moment. A network's response to a pulse can dip negative on the days
  after it while its integral is fine, and every other criterion integrates.
  Scored on runoff alone.

requires:
  fluxes: [mrro]
  states: []

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 2
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  min_window_days: 730
  variants: [control, pulse]

criteria:
  - response_nonnegativity:
      control: control
      perturbed: pulse
      driver: pr
      variable: mrro
      tolerance: 0.001

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  must_pass: [reference_bucket, flex_lumped, flex_topo]
  must_fail:
    # A derivative term sharpens its hydrograph, so the days after an
    # added storm carry less flow than without it.
    reference_overshooting: response_nonnegativity

provenance: >
  Synthetic. One weather sequence per seed, generated at run time, with
  one storm added for the second variant. Nothing is committed as data.
