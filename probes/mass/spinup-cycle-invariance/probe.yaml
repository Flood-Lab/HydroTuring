id: mass/spinup-cycle-invariance
title: A periodic climate must forget four extra spin-up cycles
law: mass
track: synthetic
version: 1

authors:
  - name: Kaihao Long
    affiliation: School of Geography and Planning, Sun Yat-sen University, Guangzhou 510006, China
    orcid: 0000-0001-7578-3378

description: >
  One seeded 365-day rain-dominated weather cycle repeats unchanged. The host
  compares the same evaluation cycle after five and after nine repetitions,
  while the adapter receives identical forcing and metadata in both runs. Once
  physical references have reached their periodic seasonal attractor, their
  runoff, evaporation, and reported stores must agree. A hidden state that
  keeps evolving with the number of cycles instead of converging is exposed,
  even when its water budget closes.

requires:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  # Ten calendar years contain two leap days.  Four extra cycles put both
  # selected evaluation years at the same leap-day phase (2007 vs 2011).
  period_days: 3652
  period_years: 10
  # One complete year supplies the state immediately before the scored
  # record.  With zero spin-up, closure would use the first row after the
  # first step as its initial state and drop that step's storage change.
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  min_window_days: 3652
  variants: [short, long]

criteria:
  - closure:
      denominator: sum_pr
      threshold: 0.05
      sinks: [evspsbl, mrro]
      sources: [gwex]
      # Closure is a precondition for both selected cycles, not just short.
      all_variants: true
      phase: evaluation

  - state_bounds:
      mrso: [0.0, soil_capacity_mm]
      snw: [0.0, null]
      canopy: [0.0, canopy_capacity_mm]
      gw: [0.0, null]
      channel: [0.0, null]
      all_variants: true
      phase: evaluation

  # The denominator in closure is the supplied precipitation.  Require the
  # adapter to echo that same forcing instead of closing against a private,
  # rescaled copy of it.
  - forcing_fidelity:
      variables: [pr]
      rtol: 1.0e-6

  - non_degenerate:
      # SAC-SMA can legitimately produce about 1.3% runoff for this seeded,
      # semi-arid cycle; 1% excludes the zero-runoff degenerate reference
      # without rejecting that physical low-runoff case.
      runoff_ratio: [0.01, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro, evspsbl]

  - spinup_cycle_invariance:
      short: short
      long: long
      variables: [evspsbl, mrro, mrso, snw, canopy]
      optional: [gwex, gw, channel]
      threshold: 0.05
      # 5% is the suite engineering rule; the 0.05 mm/day and 1 mm floors
      # keep near-zero fluxes and empty stores numerically well-conditioned.
      # Gate references span 0.00% to 0.36%, leaving a conservative margin.
      flux_floor_mm_per_day: 0.05
      state_floor_mm: 1.0

baselines:
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    reference_restless: spinup_cycle_invariance
    reference_leaky: closure
    reference_cheater: state_bounds
    reference_degenerate: non_degenerate

provenance: >
  Synthetic. A deterministic 365-day forcing cycle is generated from the
  recorded seed, then repeated nine times. Only host-side phase labels differ
  between short and long variants; adapters receive the same visible inputs.
