id: mass/warming-response
title: Warmer air over the same rain must mean more evaporation and less runoff
law: mass
track: synthetic
version: 1

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  The same ten years of rain twice, once as drawn and once with the air
  three degrees warmer over the scored years, potential evaporation
  following the temperature. Nothing else changes. Warmer air over the same
  water means more of it evaporates and less of it runs off, so integrated
  over the record the model's runoff must fall, and its evaporation must
  rise where it reports one, by a real share of the extra demand and by no
  more than all of it. This is an ablation of one driver, holding the
  other fixed, to see whether the model's internal relationship between
  temperature and streamflow points the way the physics says. A catchment
  without snow, so that timing does not confound the sign.

requires:
  fluxes: [mrro]
  states: []

case:
  generator: generate.py
  n_seeds: 5
  timestep: PT1D
  period_years: 10
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  # The sign of the response is a statement about integrated volumes. Inside
  # a month it can be dominated by storage, so a submitted model's window is
  # widened to a full year.
  min_window_days: 365

  # The first name is the control. Both variants carry byte-identical rain;
  # `warmer` differs only in temperature and the potential evaporation that
  # follows from it, and only over the scored years, so both enter the
  # window from the same state.
  variants: [control, warmer]

criteria:
  # Runoff must fall and evaporation must rise, each by at least a tenth of
  # the added evaporative demand and by no more than all of it. Evaporation
  # is checked only for models that report it; runoff is enough to be
  # scored.
  - response_sign:
      control: control
      perturbed: warmer
      driver: pet
      fixed: [pr]
      expect:
        mrro: decrease
        evspsbl: increase
      min_share: 0.1
      max_share: 1.1

  # A response without variability is satisfiable by a constant. Runoff has
  # to actually vary with the weather.
  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  must_pass: [reference_bucket]
  must_fail:
    # Evaporates all precipitation whatever the temperature, so warming
    # changes nothing.
    reference_degenerate: response_sign
    # Runs off a fixed share of a store that only ever sees rain. It never
    # reads the temperature at all.
    reference_streamflow_only: response_sign

provenance: >
  Synthetic. One weather sequence per seed, generated at run time, warmed
  three degrees for the second variant. Nothing is committed as data.
