id: mass/runoff-bounds
title: Runoff is bounded by rain minus demand below and by rain above
law: mass
track: synthetic
version: 1

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  Ten years of continental weather on a lumped catchment, and one question
  a model can be asked without reporting anything but runoff: is what ran
  off possible? Water that did not run off either evaporated or is still
  stored, and evaporation cannot exceed demand, so over the record runoff
  must be at least rain minus potential evaporation minus what the
  catchment can hold, and at most rain plus what it could have released.
  This is the mass question a streamflow-only model can be asked; the
  closure probe can only call such a model INCOMPLETE.

requires:
  fluxes: [mrro]
  states: []

case:
  generator: generate.py
  n_seeds: 5
  timestep: PT1D
  period_years: 10
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  # The bounds are statements about long integrals.
  min_window_days: 3650

criteria:
  - runoff_bounds:
      capacity: [soil_capacity_mm, canopy_capacity_mm]
      tolerance: 0.02

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  must_pass: [reference_bucket, flex_lumped, flex_topo]
  must_fail:
    # Evaporates everything: runs off nothing, below the lower bound.
    reference_degenerate: runoff_bounds
    # Reports 30 percent more runoff than its stores released.
    reference_overflowing: runoff_bounds

provenance: >
  Synthetic. Generated at run time from a recorded seed. Nothing is
  committed as data.
