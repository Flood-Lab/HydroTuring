id: mass/causality
title: A catchment cannot respond to rain that has not fallen yet
law: mass
track: synthetic
version: 1

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  Two years of the same weather twice, the second copy with one storm of
  40 mm added on a single day in the second year. Up to that day the two
  records are identical, so everything the model reports must be identical
  too, to floating point; after it, the runoff has to answer. A model that
  differs before the storm has used the storm: a bidirectional pass, a
  centred filter, an attention window, or statistics taken over the whole
  record it was handed. Scored on runoff alone, so every runoff model can
  be asked.

requires:
  fluxes: [mrro]
  states: []

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 2
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  # The whole record: the before and the after both have to be there.
  min_window_days: 730
  variants: [control, pulse]

criteria:
  - causality:
      control: control
      perturbed: pulse
      driver: pr
      variables: [mrro, evspsbl, mrso, snw, canopy]
      rtol: 1.0e-6
      min_share: 0.02

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  # The exact bucket and the two hand-written physical models from
  # chrimerss/HydrologicModels. A probe that fails any of them is wrong.
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    # Reports runoff smoothed over a centred window, so three days of the
    # future leak into every value.
    reference_anticipating: causality

provenance: >
  Synthetic. One weather sequence per seed, generated at run time, with one
  storm added for the second variant. Nothing is committed as data.
