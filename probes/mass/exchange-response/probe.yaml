id: mass/exchange-response
title: A declared head-driven exchange must respond to its external head
law: mass
track: synthetic
version: 1

authors:
  - name: Songkun Yan
    affiliation: School of Civil Engineering and Environmental Science, University of Oklahoma, Norman, OK, USA
    orcid: 0009-0008-3820-104X
    github: Skyan1002

description: >
  `gwex` lets a model whose catchment gains or loses water across its boundary
  declare that flux, so its budget closes over a term it admits to rather than
  hiding it in the residual. Nothing yet says what a declared exchange may look
  like, so a model can solve for the exchange as whatever balances its budget
  exactly as `reference_cheater` solves for storage. Write the budget without
  the exchange as R0 = pr - evspsbl - mrro - d(stores)/dt, so that the budget
  the suite checks is R = R0 + gwex; a model that closes has R about zero and
  therefore gwex about -R0 identically, to 2e-13 mm/day on a real
  implementation. Comparing the declared flux with the residual it closes is
  the same number twice, and no bound on its magnitude can separate an honest
  exchange from an invented one. A discriminator has to use information that is
  not algebraically fixed by closure. This probe prescribes an external
  hydraulic head `gwh` as a visible forcing column and runs the same weather
  three times, with the head as given, raised by half a metre and lowered by
  half a metre; `gwh` is the only quantity varied between the runs. A model
  that lists `gwh` in needs_forcing or uses_forcing asserts that its declared
  `gwex` responds monotonically to that potential, and is held to it: raising
  the head must bring more water into the catchment and lowering it less, up
  to a floating-point tolerance and with no physical minimum, since a boundary
  of small conductance responds by a small amount and is physical. How often the exchange reverses, and
  how that compares with the head, is reported and never gated: a physical
  head-driven system can reverse its boundary flux as often as its own internal
  head moves, which the case does not prescribe. A model that does not consume
  the prescribed head is not judged on its response; one that declares no
  exchange, or one below rounding error, passes.

requires:
  # gwex is required, so a model that does not use the channel is N/A rather
  # than judged on a flux it never claimed. Rain and the water stores are
  # needed for the availability bound and for the closure precondition.
  fluxes: [pr, evspsbl, mrro, gwex]
  states: [mrso, snw, canopy]

case:
  generator: generate.py
  n_seeds: 5
  timestep: PT1D
  period_years: 10
  spinup_days: 365
  # The rainless stretches sit in the last two scored years, so the window has
  # to reach them; storage carries across the record besides.
  min_window_days: 3650
  max_output_mb: 2.0
  max_runtime_s: 120

  # The first name is the control. The generator produces byte-identical
  # weather for all three and differs only in the prescribed head.
  variants: [control, raised, lowered]

criteria:
  # Precondition, not the point: the declared exchange has to be carrying the
  # closure, and the declared number has to be the water that actually moved.
  - closure:
      denominator: sum_pr
      threshold: 0.05
      sinks: [evspsbl, mrro]
      sources: [gwex]

  # The probe's own question, a paired counterfactual on the prescribed head.
  # For a model whose manifest declares it consumes `gwh`, G = sum gwex_t dt
  # over the scored record must rise when the head is raised and fall when it
  # is lowered, beyond a tolerance of `epsilon` * max(G_gross, 1 mm) that is
  # for floating point only. No physical minimum: a small conductance gives a
  # small response and is physical; what is excluded is no response, or the
  # wrong sign. Nothing about the exchange's own timing is asserted: how often it reverses inside the rainless windows,
  # and how that compares with the head's turning points, is reported as a
  # diagnostic only, because a head-driven system's flux reverses as often as
  # its internal head moves and the case does not prescribe that.
  #
  # Calibration, all five gate seeds (README.md has the table):
  # reference_driven_exchange answers a +0.5 m head with +3650 mm over the
  # record and -0.5 m with -3197 to -3385 mm; reference_noise_sink, which
  # declares the head and never reads it, answers both with exactly 0 mm. The
  # tolerance is of the order of 1e-5 mm for either.
  - exchange_response:
      variable: gwex
      driver: gwh
      control: control
      raised: raised
      lowered: lowered
      epsilon: 1.0e-8
      # Diagnostics, never gated.
      quiescent_label: dry
      segment_column: _regime
      deadband: 0.05
      # G = sum |gwex_t| dt over the control record. Under this share of the
      # record's precipitation the criterion returns PASS with the reason named
      # ("negligible exchange"), never an unscored state.
      negligible_share_of_pr: 1.0e-4
      check_availability: true

  # The exchange must not be closing a budget against a rescaled driver.
  - forcing_fidelity:
      variables: [pr]
      rtol: 1.0e-6

  - state_bounds:
      mrso: [0.0, soil_capacity_mm]
      snw: [0.0, null]
      canopy: [0.0, canopy_capacity_mm]

  # A declared exchange can also be used to manufacture runoff out of nothing,
  # so the partition still has to be non-trivial. `non_degenerate` already
  # counts gwex as supply when it computes the runoff ratio.
  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro, evspsbl]

baselines:
  # The four physical models plus a positive control built for this probe.
  # None of the four consumes the prescribed head, so none is gated on its
  # response; they must still pass closure, bounds and the availability law.
  # reference_driven_exchange is the one that matters: it declares the head
  # and follows it, so it answers the counterfactual, and it reverses inside
  # the scored windows as its own head dynamics dictate. It must pass, and a
  # probe that failed it would be punishing a model for doing what it was told.
  must_pass:
    [reference_bucket, flex_lumped, flex_topo, sacsma_snow17, reference_driven_exchange]
  must_fail:
    reference_noise_sink: exchange_response

provenance: >
  Synthetic. Generated at run time by generate.py from a recorded seed.
  Nothing is committed as data, so there is nothing to memorise. Proposal:
  https://github.com/Flood-Lab/HydroTuring/issues/76.
