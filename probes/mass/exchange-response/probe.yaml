id: mass/exchange-response
title: A declared head-driven exchange must respond to its external head
law: mass
track: synthetic
version: 1

authors:
  - name: Songkun Yan
    affiliation: School of Civil Engineering and Environmental Science, University of Oklahoma, Norman, OK, USA
    orcid: 0009-0008-3820-104X
    github: Skyan1002

description: >
  `gwex` lets a model whose catchment gains or loses water across its boundary
  declare that flux, so its budget closes over a term it admits to rather than
  hiding it in the residual. Nothing yet says what a declared exchange may look
  like, so a model can solve for the exchange as whatever balances its budget
  exactly as `reference_cheater` solves for storage. Write the budget without
  the exchange as R0 = pr - evspsbl - mrro - d(stores)/dt, so that the budget
  the suite checks is R = R0 + gwex; a model that closes has R about zero and
  therefore gwex about -R0 identically, to 2e-13 mm/day on a real
  implementation. Comparing the declared flux with the residual it closes is
  the same number twice, and neither the magnitude of gwex nor its timing on
  its own can separate an honest exchange from an invented one. A discriminator
  has to use information that is not algebraically fixed by closure. This probe
  prescribes an external hydraulic head `gwh` as a visible forcing column and
  runs the same weather three times, with the head as given, raised by half a
  metre and lowered by half a metre from the first scored step on, the spinup
  identical across the three. A model that declares it consumes `gwh` asserts
  that its declared exchange responds monotonically to that potential, and is
  held to it: raising the head must bring more water in and lowering it less,
  by at least a small share of the model's own gross exchange — a share that a
  head-driven boundary of any conductance clears, and a token head term on top
  of an accounting sink does not. A model that does not declare `gwh` is
  INCOMPATIBLE and not scored. Reversal is reported and never gated.

requires:
  # gwex is required, so a model that does not use the channel is N/A rather
  # than judged on a flux it never claimed. Rain and the water stores are
  # needed for the availability bound and for the closure precondition.
  fluxes: [pr, evspsbl, mrro, gwex]
  states: [mrso, snw, canopy]
  # The verdict rests on the prescribed head. A model that does not declare it
  # consumes `gwh` has not claimed a head-driven exchange and is INCOMPATIBLE,
  # N/A, rather than passed on a criterion that never judged it — the same
  # footing as `rlds` on energy/radiation-consistency. Declaring it is the
  # semantic opt-in AGENTS.md describes.
  forcing: [gwh]

case:
  generator: generate.py
  n_seeds: 5
  timestep: PT1D
  period_years: 10
  spinup_days: 365
  # The rainless stretches sit in the last two scored years, so the window has
  # to reach them; storage carries across the record besides.
  min_window_days: 3650
  max_output_mb: 2.0
  max_runtime_s: 120

  # The first name is the control. The generator produces byte-identical
  # weather for all three and differs only in the prescribed head, and only
  # from the first scored step: the spinup is identical, so a model enters the
  # scored record in the same state in every variant and its answer to the
  # shift falls inside the window that is scored. A fast aquifer given the
  # shift during spinup has finished answering before scoring begins.
  variants: [control, raised, lowered]

criteria:
  # Precondition, not the point: the declared exchange has to be carrying the
  # closure, and the declared number has to be the water that actually moved.
  - closure:
      denominator: sum_pr
      threshold: 0.05
      sinks: [evspsbl, mrro]
      sources: [gwex]

  # The probe's own question, a paired counterfactual on the prescribed head.
  # For a model that declares it consumes `gwh`, G = sum gwex_t dt over the
  # scored record must rise when the head is raised and fall when it is
  # lowered, each by at least `min_response_share` of the control run's
  # total variation, sum |gwex_t - gwex_t-1| dt (floored by `epsilon` for
  # floating point). A share, not an absolute minimum, so conductance cancels
  # and a weak boundary is not penalised for being weak. Of the variation,
  # not the gross: a boundary that also drains recharge has a gross of the
  # order of the throughput, independent of storativity, while its response
  # is S * dh, so a share of the gross fails an exact losing catchment at
  # confined storativities (2.4e-4 at S = 1 mm/m). A steady throughput adds
  # little to how much the exchange moves, so the variation is far less
  # sensitive: the same catchment sits at 6e-3 at S = 1 mm/m and 2.6e-3 at
  # S = 0.3, and only at S = 0.1 mm/m, a tenth of the confined top, does it
  # reach 9e-4. The floor is set three times under that, at 3e-4, and still
  # three hundred times above the token cheat (1.1e-6). What it excludes is
  # named in the README: a boundary of storativity under about 0.03 mm/m
  # that also carries a strongly varying throughput. Reversal statistics are
  # reported as diagnostics only.
  #
  # Calibration, all five gate seeds (README.md has the table and the sweep):
  # reference_driven_exchange 6.5, reference_evolving_exchange 1.1e-2,
  # reference_recharge_exchange 5.4e-3 to 8.6e-3 (S = 1 mm/m),
  # reference_noise_sink 0, reference_token_exchange 1.0e-6 to 1.1e-6.
  - exchange_response:
      variable: gwex
      driver: gwh
      control: control
      raised: raised
      lowered: lowered
      min_response_share: 3.0e-4
      epsilon: 1.0e-8
      # Diagnostics, never gated.
      quiescent_label: dry
      segment_column: _regime
      deadband: 0.05
      # G = sum |gwex_t| dt over the control record. Under this share of the
      # record's precipitation the criterion returns PASS with the reason named
      # ("negligible exchange"), never an unscored state.
      negligible_share_of_pr: 1.0e-4
      check_availability: true

  # The exchange must not be closing a budget against a rescaled driver.
  - forcing_fidelity:
      variables: [pr]
      rtol: 1.0e-6

  - state_bounds:
      mrso: [0.0, soil_capacity_mm]
      snw: [0.0, null]
      canopy: [0.0, canopy_capacity_mm]

  # A declared exchange can also be used to manufacture runoff out of nothing,
  # so the partition still has to be non-trivial. `non_degenerate` already
  # counts gwex as supply when it computes the runoff ratio.
  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro, evspsbl]

baselines:
  # The probe requires the prescribed head, so the four physical models, none
  # of which declares it, are INCOMPATIBLE here and cannot stand as baselines —
  # the footing energy/radiation-consistency stands on. Three positive
  # controls declare it and follow it. reference_driven_exchange holds a
  # constant internal head and answers with a sustained flux.
  # reference_evolving_exchange lets its internal head move, is in equilibrium
  # when scoring begins, and answers with the small transient a real aquifer
  # gives — the one that fails if the shift begins during spinup.
  # reference_recharge_exchange is the evolving boundary on a losing catchment
  # that drains half its runoff through it, at S = 1 mm/m: the one that pins
  # the normalisation, since a share of the gross exchange fails it and a
  # share of the exchange's variation does not. Two negative controls declare
  # the head and do not follow it: reference_noise_sink answers with exactly
  # zero, and reference_token_exchange adds a head term a million times too
  # small to be anything but a token.
  must_pass: [reference_driven_exchange, reference_evolving_exchange, reference_recharge_exchange]
  must_fail:
    reference_noise_sink: exchange_response
    reference_token_exchange: exchange_response

provenance: >
  Synthetic. Generated at run time by generate.py from a recorded seed.
  Nothing is committed as data, so there is nothing to memorise. Proposal:
  https://github.com/Flood-Lab/HydroTuring/issues/76.
