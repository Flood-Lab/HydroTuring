id: mass/phase-counterfactual
title: Rain that would have been snow is still the same water
law: mass
track: synthetic
version: 1

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  Three years of continental weather twice, the second time with every
  sub-freezing day lifted to a degree above the snow threshold and nothing
  else changed: the same precipitation, the same demand. In one record a
  third of the water arrives as snow and waits for spring; in the other it
  arrives as rain and does not wait. Timing moves; mass does not. Integrated
  over the record, runoff, and evaporation where it is reported, may
  differ between the two by at most a share of the rain. A snow store that
  loses water it never reports, to sublimation or to a learned sink, shows
  as a difference that exists only when it snows. Scored on runoff alone.

requires:
  fluxes: [mrro]
  states: []

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 3
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  min_window_days: 1095
  variants: [control, warm]

criteria:
  - phase_invariance:
      control: control
      perturbed: warm
      volumes: [mrro, evspsbl]
      threshold: 0.05

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  must_pass: [reference_bucket, flex_lumped, flex_topo]
  must_fail:
    # Loses forty percent of every snowfall to a sublimation it never reports.
    reference_sublimating: phase_invariance

provenance: >
  Synthetic. One weather sequence per seed, generated at run time, its
  freezing days lifted above the threshold for the second variant. Nothing
  is committed as data.
