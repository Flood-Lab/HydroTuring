id: mass/extreme-rain
title: More rain cannot mean less runoff, nor more runoff than was added
law: mass
track: synthetic
version: 1

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  Three years of the same weather four times, with the largest storm of the
  record scaled by one, two, five and ten, up to a day of rain far outside
  anything a training record holds. Along that ladder the integrated
  runoff may not fall, no rung may add more runoff than it added rain, and
  of the rain added at the top most has to run off, because evaporation is
  bounded by demand and storage by capacity. A learned response that
  flattens or turns down beyond the training range fails the first two; one
  that amplifies fails the third. Scored on runoff alone.

requires:
  fluxes: [mrro]
  states: []

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 3
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  # The whole record, so the storm and everything it drains through are in.
  min_window_days: 1095
  variants: [control, x2, x5, x10]

criteria:
  - monotone_response:
      driver: pr
      variable: mrro
      min_share: 0.1
      max_share: 1.05
      tolerance: 0.01
      capacity: [soil_capacity_mm, canopy_capacity_mm]

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro]

baselines:
  # The exact bucket and the two hand-written physical models from
  # chrimerss/HydrologicModels. A probe that fails any of them is wrong.
  must_pass: [reference_bucket, flex_lumped, flex_topo]
  must_fail:
    # Caps its daily runoff, so the top rungs of the ladder add rain and no
    # runoff.
    reference_saturating: monotone_response

provenance: >
  Synthetic. One weather sequence per seed, generated at run time, its
  largest storm scaled for the other variants. Nothing is committed as data.
