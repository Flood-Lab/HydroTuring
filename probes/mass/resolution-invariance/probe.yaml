id: mass/resolution-invariance
title: Integrated runoff must not depend on the step the weather was given at
law: mass
track: synthetic
version: 2

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  One month of synthetic weather generated minute by minute, with storms
  that have structure inside the hour, served at the minute, the hour and
  the day so that every hour and every day carries exactly the water of its
  minutes. Each model is run at its own step and at the next finer one, and
  the runoff volume over the month is integrated from both. Water is
  conserved under aggregation, so the two must agree; the number reported
  is how far they do not, in percent of the rain that fell. A model built
  at one step and run at another drains its stores as if each row were the
  step it was trained on, and that number is large. Peaks legitimately
  change with the step and are not judged here.

requires:
  fluxes: [mrro]
  states: []

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1M
  period_days: 30
  spinup_days: 10
  max_output_mb: 8.0
  max_runtime_s: 300

  # The same weather at three steps. A model is run at the variant matching
  # its own step and at the next finer one; the finest pairs with the next
  # coarser. The manifest's step is where the model lives, not a way out.
  variants: [minute, hourly, daily]
  timesteps:
    hourly: PT1H
    daily: PT1D
  variant_selection: native_and_finer

criteria:
  # The probe's assertion: integrated volumes agree between the steps, to
  # within a share of the precipitation that fell. Evapotranspiration and
  # storages are compared too when the model reports them; runoff is enough
  # to be scored.
  #
  # The share is calibrated on physical models, not on the engineering rule.
  # A conservative bucket whose partition is nonlinear in rain intensity
  # legitimately moves between an hourly and a daily step, because within-
  # day intensity is real physics: the exact bucket moves by about 1 percent
  # of the rain, flex_lumped by 2.5, flex_topo by 5.1 on one gate seed. The
  # limit sits at twice the largest of those. The broken fixed-step model
  # moves by 49 percent and the two neural models evaluated so far by 66 and
  # 216 (482 with fresh seeds) before parameter scaling.
  - resolution_invariance:
      volumes: [mrro, evspsbl]
      states: [mrso, snw, canopy]
      threshold: 0.10

  # Invariance alone is satisfiable by reporting nothing twice. The record
  # is a month, so the runoff ratio is reported rather than judged and the
  # rainfall response is switched off; the variability of runoff has to be
  # real.
  - non_degenerate:
      min_flux_cv: 0.1
      min_response: null
      cv_variables: [mrro]

baselines:
  # The exact bucket and the two hand-written physical models from
  # chrimerss/HydrologicModels. A probe that fails any of them is wrong.
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    reference_fixed_step: resolution_invariance
    reference_degenerate: non_degenerate

provenance: >
  Synthetic. One minute-by-minute weather sequence per seed, generated at run
  time and aggregated to hours and days for the coarser variants. Nothing is
  committed as data.
