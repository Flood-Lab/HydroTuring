id: energy/pet-consistency
title: Evaporation follows demand when the soil is wet and water when it is dry
law: energy
track: synthetic
version: 1

authors:
  - name: Zhi Li
    affiliation: University of Colorado Boulder
    github: chrimerss

description: >
  Ten years of continental weather on a lumped catchment, and the surface
  energy balance stated with the water variables every model that reports
  evaporation has. The available energy, read as potential evaporation,
  sets the ceiling; the available water decides how much of it is used.
  So on the days the model's own soil store is in the wettest fifth of
  its range, its evaporation must reach most of the potential and never
  exceed it; on the days the store is in the driest fifth it must reach a
  smaller share than when wet; and over the record it may not exceed the
  potential at all. A model whose evaporation never
  reads the demand conserves water perfectly and fails all three.

requires:
  fluxes: [evspsbl, mrro]
  states: [mrso]

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1D
  period_years: 10
  spinup_days: 365
  max_output_mb: 2.0
  max_runtime_s: 300
  min_window_days: 3650

criteria:
  - demand_consistency:
      wet_quantile: 0.8
      dry_quantile: 0.2
      min_wet_ratio: 0.7
      min_contrast: 0.05
      max_ratio: 1.0
      tolerance: 0.01

  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro, evspsbl]

baselines:
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    # Evaporates a fixed share of its soil store every day whatever the demand.
    reference_thirsty: demand_consistency

provenance: >
  Synthetic. Generated at run time from a recorded seed. Nothing is
  committed as data.
