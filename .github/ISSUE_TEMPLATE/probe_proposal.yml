name: Probe proposal
description: Propose a new conservation probe before building it
title: "[PROBE] "
labels: ["probe-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals come before pull requests. It costs you ten minutes and it
        saves you from building a probe that duplicates one under review, or
        one that turns out not to discriminate.

        Once this is labelled `accepted` it is assigned to you and it is
        yours: fork, build, open a pull request from the fork. One merged probe
        earns co-authorship on the benchmark paper. See
        [CONTRIBUTING.md](https://github.com/Flood-Lab/HydroTuring/blob/main/CONTRIBUTING.md#credit).

        Because a merged probe is authorship, the form asks who you are up
        front. What you write here goes into `authors` in your `probe.yaml`,
        into CONTRIBUTORS.md and CITATION.cff, and onto the paper's author
        list, so it does not have to be gathered again at submission time.
        A contact email is not asked for on a public issue; the maintainer
        will ask for one privately when the probe merges.

  - type: textarea
    id: authors
    attributes:
      label: Authors
      description: >
        One line per author, in the order they should appear: full name as it
        should be printed, affiliation with department and city (or
        "independent"), and ORCID if you have one. Every author listed here
        is a co-author of the paper once the probe merges.
      placeholder: |
        Jane Doe, Department of Civil Engineering, University of Somewhere, Boulder CO, 0000-0002-1825-0097
        Ada Lovelace, independent, 0000-0001-5109-3700
    validations: {required: true}

  - type: dropdown
    id: law
    attributes:
      label: Conservation law
      options: [mass, energy, momentum]
    validations: {required: true}

  - type: textarea
    id: residual
    attributes:
      label: Residual equation
      description: Write the budget explicitly, with units.
      placeholder: "R = pr - evspsbl - mrro - d(mrso + snw + canopy)/dt   [mm/day]"
    validations: {required: true}

  - type: textarea
    id: tolerance
    attributes:
      label: Tolerance and its denominator
      description: >
        The suite uses the 5 percent engineering rule. Say what the residual is
        5 percent of, and whether the denominator can approach zero. If it can,
        propose an absolute floor as well.
    validations: {required: true}

  - type: textarea
    id: discrimination
    attributes:
      label: How would an unphysical model fail this?
      description: >
        The most important question on this form. Describe a model that would
        pass your probe while understanding no physics, and say which criterion
        would catch it. If you cannot construct one, the probe may not
        discriminate.
    validations: {required: true}

  - type: textarea
    id: generator
    attributes:
      label: How is the case generated?
      description: >
        Synthetic track probes generate forcing from a seed at run time.
        Sketch the generator. If you need real data instead, say which dataset
        and why synthetic will not do.
    validations: {required: true}

  - type: dropdown
    id: builder
    attributes:
      label: Will you build it?
      description: >
        This decides who the issue is assigned to. Proposing a probe you
        cannot build yourself is still worth doing, and the proposal still
        counts as yours.
      options:
        - "Yes — assign it to me"
        - "No — I am proposing it for someone else to build"
    validations: {required: true}
