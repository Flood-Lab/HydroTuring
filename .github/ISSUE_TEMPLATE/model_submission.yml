name: Model proposal
description: Propose a hydrologic model for HydroTuring to package and evaluate
title: "[MODEL] "
labels: ["model-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a model you think HydroTuring should have a verdict on. A
        passing result is not required: incomplete and failing models are
        scientifically useful outcomes. Please point to immutable releases or
        commits where possible.

        **You do not need to be able to package it yourself.** The *packaging
        status* field below decides who the issue is assigned to and nothing
        else — say that help is needed and it goes to the maintainer.

        Five accepted model proposals count the same as one merged probe
        towards co-authorship on the benchmark paper, whoever ends up doing
        the packaging. Knowing which models are worth putting through the
        benchmark is a judgement about the field, and it is not one the
        maintainer can make alone. See
        [CONTRIBUTING.md](https://github.com/Flood-Lab/HydroTuring/blob/main/CONTRIBUTING.md#credit).

        Because accepted proposals accumulate towards authorship, the form
        asks who is proposing. This is what CONTRIBUTORS.md and the paper's
        author list are built from. A contact email is not asked for on a
        public issue; the maintainer will ask for one privately if and when
        your proposals cross the authorship line.

  - type: input
    id: proposer
    attributes:
      label: Proposer
      description: >
        Your full name as it should be printed, your affiliation with
        department and city (or "independent"), and your ORCID if you have
        one.
      placeholder: "Jane Doe, Department of Civil Engineering, University of Somewhere, Boulder CO, 0000-0002-1825-0097"
    validations: {required: true}

  - type: input
    id: model_name
    attributes:
      label: Model name
      placeholder: "ExampleHydroNet"
    validations: {required: true}

  - type: dropdown
    id: category
    attributes:
      label: Model category
      description: Choose the category that best describes how the model produces its predictions.
      options:
        - AI-based
        - AI+physics
        - physics
    validations: {required: true}

  - type: input
    id: code_repository
    attributes:
      label: Model code repository
      description: Link to the source-code repository HydroTuring should package.
      placeholder: "https://github.com/organisation/model"
    validations: {required: true}

  - type: input
    id: code_revision
    attributes:
      label: Version, release, or commit
      description: Identify the exact code revision to evaluate so the result is reproducible.
      placeholder: "v1.2.0 or commit SHA"
    validations: {required: true}

  - type: input
    id: weights_repository
    attributes:
      label: Weights repository (optional)
      description: Link to pretrained weights or a model registry. Leave blank if no weights are required or they are stored with the code.
      placeholder: "https://huggingface.co/organisation/model"

  - type: input
    id: reference
    attributes:
      label: Paper or model reference (optional)
      description: DOI, preprint, technical report, or project page describing the model.
      placeholder: "https://doi.org/..."

  - type: input
    id: license
    attributes:
      label: Code and weights licenses
      description: State the code license and, when applicable, the weights license.
      placeholder: "Code: MIT; weights: CC-BY-4.0"
    validations: {required: true}

  - type: dropdown
    id: timestep
    attributes:
      label: Supported timestep
      options:
        - PT1D (daily)
        - PT1H (hourly)
    validations: {required: true}

  - type: textarea
    id: inputs
    attributes:
      label: Required inputs
      description: List forcing variables, static attributes, units, and any required history or initialization.
      placeholder: |
        Forcing: precipitation (mm/day), temperature (degC), PET (mm/day)
        Static: catchment area, soil attributes
        Initialization: 365 daily steps
    validations: {required: true}

  - type: dropdown
    id: outputs
    attributes:
      label: Outputs produced by the model
      description: Select only quantities the model genuinely produces. Select all that apply.
      multiple: true
      options:
        - pr — precipitation echoed from the forcing
        - evspsbl — evapotranspiration
        - mrro — total runoff
        - dis — river discharge
        - mrso — soil water storage
        - snw — snow water equivalent
        - canopy — canopy interception storage
    validations: {required: true}

  - type: input
    id: evaluation_window
    attributes:
      label: Evaluation window (optional)
      description: >-
        Is there a time window you want the test to run over? Submitted models
        are evaluated on a window around a flood event rather than the full
        generated record, so a heavy model fits its time budget. Leave blank
        for the default: up to one month for daily models and seven days for
        hourly models. Write "full" to be evaluated on the whole record.
      placeholder: "30 days"

  - type: dropdown
    id: packaging
    attributes:
      label: Packaging status
      description: >-
        This decides who the issue is assigned to. "Ready" means it is yours
        to finish: fork, package, open a pull request. Either "help is needed"
        assigns it to the maintainer instead. Neither answer affects whether
        the proposal is accepted, and neither affects your credit for it.
      options:
        - Dockerfile and HydroTuring adapter are ready
        - Dockerfile is ready; adapter help is needed
        - Help is needed with both Docker packaging and the adapter
    validations: {required: true}

  - type: textarea
    id: run_instructions
    attributes:
      label: Installation and inference notes
      description: Describe how to install dependencies, obtain weights, initialize the model, and run inference without network access.
      placeholder: "Commands, environment requirements, weight filenames, and expected resource needs"
    validations: {required: true}

  - type: textarea
    id: why
    attributes:
      label: Why this model belongs in the benchmark
      description: >-
        What would we learn from its verdict that we do not already know?
        Widely used, architecturally novel, makes an explicit conservation
        claim, or is believed to conserve and has never been checked — any of
        these is a good answer. This is the field judgement the proposal is
        credited for.
    validations: {required: true}

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I have identified a reproducible code revision and have permission to use the linked code and weights for this evaluation.
          required: true
        - label: I understand that HydroTuring may report PASS, VIOLATION, INCOMPLETE, INCOMPATIBLE, or ERROR.
          required: true
