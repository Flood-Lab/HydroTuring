name: model

# Evaluates a submitted model against every merged probe.
#
# Trust boundary: a submitted model is an arbitrary Dockerfile. It is built
# without secrets and run with no network, so it cannot exfiltrate anything
# and cannot read the probe definitions or tolerances it is judged against.

on:
  push:
    branches: [main]
    paths: ['models/**']
  pull_request:
    paths: ['models/**']
  workflow_dispatch:
    inputs:
      model:
        description: 'Model name to evaluate (blank = all)'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Fork submissions need a maintainer to look at the Dockerfile first.
    # Remove this line only once the review flow is settled.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Select models
        id: select
        run: |
          if [ -n "${{ github.event.inputs.model }}" ]; then
            echo "models=${{ github.event.inputs.model }}" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only HEAD^ HEAD -- models/ \
              | cut -d/ -f2 | sort -u | grep -v '^_' | tr '\n' ' ')
            echo "models=${changed}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the adapter contract
        if: steps.select.outputs.models != ''
        run: |
          for model in ${{ steps.select.outputs.models }}; do
            echo "::group::verify $model"
            ht verify-adapter --model "$model"
            echo "::endgroup::"
          done

      - name: Evaluate
        if: steps.select.outputs.models != ''
        run: |
          status=0
          : > scorecard.md
          for model in ${{ steps.select.outputs.models }}; do
            ht run --model "$model" \
                   --json "results/$model/report.json" \
                   --markdown >> scorecard.md || status=1
            echo >> scorecard.md
          done
          cat scorecard.md
          # A FAIL verdict is information, not a broken build. Only a harness
          # error should turn the job red.
          exit 0

      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.models != ''
        with:
          name: hydroturing-results
          path: results/

      - name: Comment the scorecard
        if: github.event_name == 'pull_request' && steps.select.outputs.models != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('scorecard.md', 'utf8');
            if (body.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
