name: model

# Evaluates a submitted model against every merged probe, on request only.
#
# Evaluations are run by a maintainer on a local machine with Docker and
# archived in models/result.csv; that archive is the record. This workflow
# is kept for an independent re-run of one model on a clean runner, and is
# no longer triggered by pushes or pull requests: a heavy model does not fit
# the 45-minute budget on a four-core runner, and re-evaluating every model
# on every touch of models/ was cost without a decision attached to it.
#
#   gh workflow run model --ref main -f model=<name>
#
# Trust boundary: a submitted model is an arbitrary Dockerfile. It is built
# without secrets and run with no network, so it cannot exfiltrate anything
# and cannot read the probe definitions or tolerances it is judged against.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model name to evaluate (blank = all)'
        required: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Select models
        id: select
        run: |
          if [ -n "${{ github.event.inputs.model }}" ]; then
            echo "models=${{ github.event.inputs.model }}" >> "$GITHUB_OUTPUT"
          else
            models=$(find models -mindepth 2 -maxdepth 2 -name model.yaml \
              | cut -d/ -f2 | grep -v '^_' | tr '\n' ' ')
            echo "models=${models}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the adapter contract
        if: steps.select.outputs.models != ''
        run: |
          for model in ${{ steps.select.outputs.models }}; do
            echo "::group::verify $model"
            ht verify-adapter --model "$model"
            echo "::endgroup::"
          done

      - name: Evaluate
        if: steps.select.outputs.models != ''
        run: |
          status=0
          : > scorecard.md
          for model in ${{ steps.select.outputs.models }}; do
            if ht run --model "$model" \
                      --json "results/$model/report.json" \
                      --markdown >> scorecard.md; then
              code=0
            else
              code=$?
            fi
            # Exit 1 is a scientific FAIL and belongs in the scorecard. Exit 2
            # is a harness/adapter ERROR and must make the workflow fail.
            if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
              status=1
            fi
            echo >> scorecard.md
          done
          cat scorecard.md
          # A FAIL verdict is information, not a broken build. Only a harness
          # error should turn the job red.
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.models != ''
        with:
          name: hydroturing-results
          path: results/

