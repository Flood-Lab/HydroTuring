name: pages

# Publishes site/ to GitHub Pages. The site is one self-contained HTML file
# with English, Spanish and Chinese served from the same page, so there is
# nothing to build and no generator to keep up to date. The one thing
# generated here is the pair of badge endpoints the README reads its probe
# and model counts from, so a merged probe or an evaluated model updates
# the counts on the repository page without anyone editing a number.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'probes/**'
      - 'models/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Count the contributions
        run: python3 scripts/badges.py site/badges
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
