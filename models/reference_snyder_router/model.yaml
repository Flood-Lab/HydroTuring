name: reference_snyder_router
version: "1.0.0"
description: >
  Geometry-aware rainfall-runoff reference for the routing-lag probe. It
  derives a duration-corrected Snyder lag from Hack channel geometry, then
  routes a fixed share of rainfall through a causal, conservative triangular
  unit hydrograph whose peak occurs that travel time after the excess-rainfall
  centroid.
authors: [binbinlan]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: [python3, ht_adapter.py]
timestep: PT1D
emits:
  fluxes: [mrro]
  states: []
needs_forcing: [pr]
needs_static: [area_km2, main_channel_length_km, centroid_channel_length_km]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
