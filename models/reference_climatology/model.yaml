name: reference_climatology
version: "1.0.0"
description: >
  A seasonal climatology dressed as a model: the mean runoff and
  evaporation for the day of the year, whatever the weather, and a storage
  that never moves. Keeps flowing through two rainless years, which no
  catchment can, and never notices a warming.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H, PT15M, PT5M, PT1M]
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
