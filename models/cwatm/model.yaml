name: cwatm
version: "1.11-5baaadd.2"
description: >
  CWatM, the Community Water Model of IIASA's Water Security group (Burek et
  al. 2020), the ISIMIP global hydrological model, at release 1.11 (commit
  5baaadd). A daily grid model driven by one settings file and netCDF maps:
  degree-day snow in elevation zones, interception, a three-layer van
  Genuchten soil with an Arno infiltration curve, preferential flow and
  capillary rise, a linear groundwater reservoir, and a triangular
  runoff-concentration lag. The adapter runs it on one grid cell whose area
  is the catchment's, with water demand, lakes, reservoirs, MODFLOW and
  kinematic routing switched off and reference evapotranspiration read from
  the probe's pet. Parameters without a counterpart in static.json are the
  land-cell medians of CWatM's own 30-arcminute input maps; README.md lists
  every choice and what it moves.
authors:
  - "IIASA Water Security Research Group (Burek, Satoh, Kahil, Tang, Greve, Smilovic, Guillaumot, Zhao, Wada et al.)"
  - "HydroTuring maintainers (adapter)"
reference: "https://doi.org/10.5194/gmd-13-3267-2020"
license: "GPL-3.0"

runner: docker
entrypoint: ["python3", "ht_adapter.py"]
# CWatM 1.11 fixes DtSec at 86400 s; it has no other step.
timestep: PT1D

# Every store the configured model carries. CWatM has no exchange with the
# outside once abstraction, inflow and MODFLOW are off, so there is no gwex.
# sbl is snowEvap: CWatM subtracts it from the snow cover (snow_frost.py:790),
# whose degree-day pack holds no liquid water, and adds it once to totalET
# (landcoverType.py:1017), so it is the share of evspsbl that left as ice.
emits:
  fluxes: [pr, evspsbl, sbl, mrro, dis]
  states: [mrso, snw, canopy, gw, channel]

needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 2, gpu: false}

# The closure probe is defined over the ten-year record and a one-cell
# CWatM runs it well inside the probe's time budget.
window_days: full
