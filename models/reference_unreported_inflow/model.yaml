name: reference_unreported_inflow
version: "1.0.0"
description: >
  The exact bucket, routing its runoff exactly and conserving water to the
  floating point, with one thing added: on every step the sky did not feed, the
  reach receives a small fixed amount of water out of a store the model never
  reports. The inflow is bounded — 0.05 mm over the whole record, four orders
  of magnitude below a storm's runoff — so the reach never comes near the
  fifteen-day bound that `momentum/routing-conservation` enforces, and the
  allowance shrinks with the decaying peak through each dry spell without the
  store ever reaching it. It fails anyway, because on step after step where no
  rain fell the store rose, and that is the one thing a reach with nothing
  entering it may not do. This is the baseline that separates the two
  questions: a bound can only see an error that accumulates, while a one-sided
  statement about the sign of the change sees an error of any size, as long as
  it is applied where nothing is coming in to mask it.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H, PT15M, PT5M, PT1M]
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy, channel]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
