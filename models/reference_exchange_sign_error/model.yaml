name: reference_exchange_sign_error
version: "0.1.0"
description: >
  A lagged-head bookkeeping reference, sharing reference_exchange_exact's
  head-tracks-smoothed-stage mechanism rather than a linear reservoir
  (needs_static declares aquifer_storage_coefficient because probe.yaml's
  requires.static asks for it, not because this adapter reads it), with a
  genuine bidirectional river exchange that closes its own groundwater
  balance exactly. Deliberately reports the aquifer-to-river component
  (gw_to_sw) without its sign, so it no longer sums to gw_sw_exchange;
  every other criterion in the probe passes.
authors: [HydroTuring maintainers]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: [python3, ht_adapter.py]
timestep: PT1D
emits:
  fluxes: [gw_sw_exchange, gw_to_sw, sw_to_gw]
  states: [gw]
needs_forcing: [gw_recharge, sw_stage_m]
needs_static: [area_km2, aquifer_specific_yield, aquifer_storage_coefficient, river_conductance_m2_per_day, river_bottom_offset_m]
resources: {cpu: 1, memory_gb: 1, gpu: false}
