name: reference_cheater
version: "1.0.0"
description: >
  Solves for storage as whatever balances the budget. Closure is exact by
  construction on every seed, so randomised forcing cannot catch it. It pins
  the state_bounds criterion, which can.
authors: ["HydroTuring maintainers"]
license: MIT
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1D
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
