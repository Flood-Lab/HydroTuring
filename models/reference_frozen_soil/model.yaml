name: reference_frozen_soil
version: "1.0.0"
description: >
  The analytic soil heat reference with reported layer temperature frozen at
  its initial value. Its native fluxes are unchanged, so surface energy still
  closes while the declared layer storage disagrees with its boundary fluxes.
authors: ["Han Wang"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1H
emits:
  fluxes: [pr, hfls, hfss, hfg, hfg_bottom]
  states: []
  diagnostics: [tsoil_layer]
needs_forcing: [pr, tas, rn]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
