name: reference_leaky_router
version: "1.0.0"
description: >
  The exact bucket routing through a three-day kernel that sums to 0.9: a
  tenth of every day's runoff enters the channel store and is never
  released. The shortfall accumulates across every step, so the channel
  rises on every recession step where nothing is entering the reach. Pins
  the recession-drainage check, which catches the direction of the error
  before any store bound is reached.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H, PT15M, PT5M, PT1M]
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy, channel]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
