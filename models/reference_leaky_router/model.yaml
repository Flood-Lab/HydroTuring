name: reference_leaky_router
version: "1.0.0"
description: >
  The bucket with a unit hydrograph whose weights sum to 0.999: a tenth of a
  percent of every day's runoff enters the channel store and never leaves.
  Reported honestly, the channel grows without bound, but by less than a
  millimetre on this probe's case — which is what makes it the model that
  governs `min_allowance_mm` rather than merely exercising the criterion.
  `reference_stuck_router` loses a tenth of the flow and is caught three
  orders of magnitude clear of the allowance; this one reaches 4.13 to 4.40
  times it, and the gate stops catching it only once the allowance passes
  0.651 mm, so a change that moves the allowance out from under the calibration
  turns the acceptance gate red.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H, PT15M, PT5M, PT1M]
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy, channel]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
