name: reference_half_soil
version: "1.0.0"
description: >
  The analytic soil heat reference with only its reported layer temperature
  response halved. Native surface and bottom fluxes remain unchanged, leaving
  the surface budget closed but the layer heat storage inconsistent.
authors: ["Han Wang"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1H
emits:
  fluxes: [pr, hfls, hfss, hfg, hfg_bottom]
  states: []
  diagnostics: [tsoil_layer]
needs_forcing: [pr, tas, rn]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
