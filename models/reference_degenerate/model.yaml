name: reference_degenerate
version: "1.0.0"
description: >
  The trivial solution: all precipitation evaporates, nothing runs off,
  storage never changes. Closes exactly for any forcing. It pins the
  non_degenerate criterion.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1D
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
