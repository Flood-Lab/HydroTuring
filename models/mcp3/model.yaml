name: mcp3
version: "5944b5f-epoch619.3"
description: >
  MCPModel3, the MA_5 architecture of Wang and Gupta (2024): three MCP nodes, a
  primary store with surface, recharge and evaporation outflows, and a surface
  and a groundwater routing node whose releases are the discharge, trained on
  the Leaf River. Packaged from YuanHWang/5MCPmodelnet_HydroTuring at 5944b5f
  with the published checkpoint model_epoch619.pt. All three stores are
  reported, under mrso, channel and gw. No snow or canopy store, which are
  reported as identically zero under zero_stores; README.md says what that does
  to its standing.
authors:
  - "Yuan-Heng Wang (University of Arizona)"
  - "Hoshin V. Gupta (University of Arizona)"
  - "HydroTuring maintainers (adapter)"
reference: "https://doi.org/10.1029/2024WR037224"
license: "Apache-2.0 (code and weights)"

runner: docker
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1D

# Every store the model carries, at the end of the row, so that the harness can
# difference them against the row's fluxes: the primary store under mrso, the
# groundwater routing node under gw, and the surface routing node, which holds
# water generated as runoff and not yet released, under channel.
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy, gw, channel]

needs_forcing: [pr, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 2, gpu: false}

# Python loops over scalar stores: a whole record takes seconds.
window_days: full
