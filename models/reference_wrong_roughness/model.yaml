name: reference_wrong_roughness
version: "1.0.0"
description: >
  Deliberately inconsistent steady reach. It reports the same discharge as
  the exact reference but computes stage with a Manning n biased 3% high.
  The rating remains smooth and monotone while its roughly 5.7% momentum
  residual sits just outside the 5% allowance.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1D
emits:
  fluxes: [dis]
  states: []
  diagnostics: [stage]
needs_forcing: [pr, tas, pet]
needs_static: [area_km2, width_m, cross_section_shape, bed_elevation_m, slope, manning_n]
supports:
  perturbation: false
resources: {cpu: 1, memory_gb: 1, gpu: false}
