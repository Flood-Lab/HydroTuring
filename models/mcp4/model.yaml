name: mcp4
version: "5944b5f-epoch2707.2"
description: >
  MCPModel4, the five-node distributed-state MCP network MN_SALO^DS(5) of Wang
  and Gupta (2025): five stores that each take the whole rain, with gates that
  read all five stores, and a discharge that is their outflows averaged with
  learned weights, trained on the Leaf River. Packaged from
  YuanHWang/5MCPmodelnet_HydroTuring at 5944b5f with the published checkpoint
  best_model_epoch2707.pt. Evaporation and storage are combined with the same
  weights, an adapter choice README.md explains. No snow, canopy, groundwater or
  routing store, which are left out rather than filled, so the probes that need
  them are N/A (INCOMPLETE); README.md says why and what that does to its
  standing.
authors:
  - "Yuan-Heng Wang (University of Arizona)"
  - "Hoshin V. Gupta (University of Arizona)"
  - "HydroTuring maintainers (adapter)"
reference: "https://doi.org/10.1029/2025WR040178"
license: "Apache-2.0 (code and weights)"

runner: docker
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1D

# The five stores together, weighted as the discharge is, at the end of the row,
# so that the harness can difference them against the row's fluxes.
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]

needs_forcing: [pr, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 2, gpu: false}

# Python loops over five scalar stores: a whole record takes seconds.
window_days: full
