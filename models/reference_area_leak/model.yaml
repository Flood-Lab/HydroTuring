name: reference_area_leak
version: "1.0.0"
description: >
  The bucket losing a share of its runoff that grows with the catchment
  area it is told: none at 25 km2, half at 2500. Depths should not depend
  on area; this model's do. It pins area invariance.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H, PT15M, PT5M, PT1M]
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
