name: reference_degree_day
version: "1.0.0"
description: >
  The same snowpack, melted on air temperature through a degree-day factor and
  with a surface energy budget that closes around its evaporation alone. Every
  reported quantity is plausible and both budgets balance on their own terms;
  what is missing is any charge for the fusion the water budget reports. It is
  the construction energy/snowmelt-energy-water exists to catch, and it fails
  that probe while passing every water probe that can ask it anything.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H]
emits:
  fluxes: [pr, evspsbl, mrro, sbl, hfls, hfss, hfg]
  states: [mrso, snw, canopy, channel]
  diagnostics: [lwsnl, csnow]
needs_forcing: [pr, tas, pet, rn]
needs_static: [soil_capacity_mm, canopy_capacity_mm, baseflow_coefficient, snow_threshold_degC, degree_day_factor_mm_per_C_day]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
