name: reference_soil_heat
version: "1.0.0"
description: >
  Analytic conductive heat storage in one homogeneous layer beneath a
  zero-capacity bare skin. Native flux equations are integrated over each
  interval and layer temperature is reported at its end. The fixed-capacity
  layer has no evaporation, phase change, advection or internal heat sources.
  Synthetic positive reference for energy/soil-heat-storage-consistency.
authors: ["Han Wang"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1H
emits:
  fluxes: [pr, hfls, hfss, hfg, hfg_bottom]
  states: []
  diagnostics: [tsoil_layer]
needs_forcing: [pr, tas, rn]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
