name: reference_sublimating
version: "1.0.0"
description: >
  The bucket losing 40 percent of every snowfall to a sublimation it
  never reports. With rain it is exact; with snow it leaks. The same water
  falling as rain instead of snow therefore changes its runoff. It pins
  phase invariance.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H, PT15M, PT5M, PT1M]
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]
needs_forcing: [pr, tas, pet]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
