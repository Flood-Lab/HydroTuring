name: hbvec_raven
version: "4.12-81011f0-alouette2.1"
description: >
  HBV-EC as emulated by Raven 4.12: upstream's executable, unmodified at commit 81011f0,
  running Raven's own HBV-EC tutorial model, Alouette2 from RavenTutorialFiles.zip
  (issue #207). Twenty-one HRUs in seven elevation bands with open and forest land
  uses, snow, liquid snow, canopy and canopy snow, a three-layer HBV soil with fast and
  slow reservoirs, and a triangular unit hydrograph. The tutorial's parameters are for
  the Alouette River, and none exist for the synthetic catchment, so results describe
  that one parameter set with area and capacities from the case. Raven is a framework;
  this is one configuration of it. Every edit to the tutorial files is listed in
  README.md and in run.json.
authors:
  - "James R. Craig, Genevieve Brown, Robert Chlumsky, R. Wayne Jenkinson, Georg Jost, Konhee Lee, Juliane Mai, Martin Serrer, Nicholas Sgro, Mahyar Shafii, Andrew P. Snowdon, Bryan A. Tolson (Raven)"
  - "HydroTuring maintainers (adapter)"
reference: "https://doi.org/10.1016/j.envsoft.2020.104728"
license: "Artistic-2.0 (upstream); adapter under this repository's licence"

runner: docker
entrypoint: ["python3", "ht_adapter.py"]
# Raven's rates are per day and its solver takes the step directly, so nothing is
# rescaled for the hourly step. README.md says why finer steps are not listed.
timestep: [PT1D, PT1H]

emits:
  # snm is liquid reaching PONDED_WATER from the precipitation partition and from
  # SNOW_LIQ's overflow. gw is the fast and slow reservoirs, SOIL[1] and SOIL[2].
  fluxes: [pr, snm, evspsbl, mrro, dis]
  states: [mrso, snw, canopy, gw, channel]

needs_forcing: [pr, tas, pet]
needs_static: [area_km2]
uses_static: [soil_capacity_mm, canopy_capacity_mm, latitude_deg]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}

# A ten-year record runs in seconds, so nothing is gained by cutting it.
window_days: full
