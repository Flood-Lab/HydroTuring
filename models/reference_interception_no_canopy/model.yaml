name: reference_interception_no_canopy
version: "1.0.0"
description: >
  Conserving positive control for mass/interception-response that carries no
  canopy store: intercepted water evaporates in the same step, and only mrso
  is reported. It exercises the representation the probe README allows.
authors: ["Yuanhang Liu"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: PT1D
emits:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso]
needs_forcing: [pr, pet]
needs_static: [canopy_capacity_mm]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
