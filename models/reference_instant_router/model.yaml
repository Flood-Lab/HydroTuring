name: reference_instant_router
version: "1.0.0"
description: >
  Deliberately wrong rainfall-runoff reference for the routing-lag probe. It
  converts rainfall to runoff in the same row, ignoring the finite travel time
  implied by the supplied channel geometry.
authors: [binbinlan]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: [python3, ht_adapter.py]
timestep: PT1D
emits:
  fluxes: [mrro]
  states: []
needs_forcing: [pr]
needs_static: [area_km2, main_channel_length_km, centroid_channel_length_km]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
