name: reference_saint_venant
version: "1.1.0"
description: >
  A one-dimensional finite-volume Saint-Venant solver for a prismatic
  rectangular reach. It prescribes upstream discharge, advances continuity
  and momentum with bed-slope and Manning-friction source terms from a
  non-equilibrium state. Daily cases retain the settled-state interior-gauge
  path; sub-daily cases continuously advance the same equations through each
  output interval and report the reach outlet so paired reach lengths measure
  the full propagation-distance difference. Paired transient reaches use a
  common approximately 80 m finite-volume cell size so reach length does not
  also change numerical resolution. It never evaluates or inverts the Manning
  normal-depth formula.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D, PT1H]
emits:
  fluxes: [dis]
  states: []
  diagnostics: [stage]
needs_forcing: [pr, tas, pet]
uses_forcing: [q_in]
needs_static: [area_km2, width_m, cross_section_shape, bed_elevation_m, slope, manning_n, reach_length_m]
supports:
  perturbation: true
resources: {cpu: 1, memory_gb: 1, gpu: false}
